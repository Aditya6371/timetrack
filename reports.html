<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <title>TimeTrack — Reports</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
</head>
<body>
  <div class="app-shell" id="app-shell">
    <main class="main-content fade-in">
      <header class="app-topbar">
        <a href="index.html" class="brand">
          <span class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
          <span class="brand-text">TimeTrack</span>
        </a>
        <div class="sync-badge local sync-badge--mobile" aria-live="polite">
          <span class="sync-dot"></span><span>Local</span>
        </div>
      </header>
      <div class="page-header">
        <h1 class="page-title">Reports</h1>
        <p class="page-subtitle">Monthly timesheet preview and export</p>
      </div>
      <div class="filter-row">
        <select id="month-select" aria-label="Month"></select>
        <select id="year-select" aria-label="Year"></select>
      </div>
      <div class="summary-chips" id="summary-row"></div>
      <button class="btn btn-primary" type="button" id="export-btn" style="margin-bottom:20px">Download Excel timesheet</button>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Date</th>
              <th>In</th>
              <th>Out</th>
              <th>Hours</th>
              <th>Payable</th>
              <th>Status</th>
              <th>Shift</th>
            </tr>
          </thead>
          <tbody id="report-body"></tbody>
        </table>
      </div>
    </main>
  </div>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/attendance.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/components.js"></script>
  <script src="js/export.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
