<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <title>TimeTrack — Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
</head>
<body>
  <div class="app-shell" id="app-shell">
    <main class="main-content fade-in">
      <header class="app-topbar">
        <a href="index.html" class="brand">
          <span class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
          <span class="brand-text">TimeTrack</span>
        </a>
        <div class="sync-badge local sync-badge--mobile" aria-live="polite">
          <span class="sync-dot"></span><span>Local</span>
        </div>
      </header>
      <div class="page-header">
        <h1 class="page-title">Settings</h1>
        <p class="page-subtitle">Profile, payroll rules, and shifts</p>
      </div>

      <div class="card">
        <h2 class="card-title">Profile</h2>
        <div class="avatar" id="avatar">?</div>
        <div class="form-group">
          <label class="form-label" for="employee-name">Employee name</label>
          <input type="text" class="form-input" id="employee-name" placeholder="Your full name" autocomplete="name">
        </div>
        <div class="form-group">
          <label class="form-label" for="employee-id">Employee ID</label>
          <input type="text" class="form-input" id="employee-id" placeholder="Optional">
          <p class="form-hint">Used in Excel exports when provided</p>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">Payroll</h2>
        <div class="form-group">
          <label class="form-label">Default payable hours</label>
          <div class="stepper">
            <button type="button" id="payable-minus" aria-label="Decrease">−</button>
            <span class="stepper-value" id="payable-hours">8</span>
            <button type="button" id="payable-plus" aria-label="Increase">+</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Payable hours rule</label>
          <div class="segmented" id="rule-segmented">
            <button type="button" data-value="fixed">Fixed</button>
            <button type="button" data-value="actual">Actual</button>
            <button type="button" data-value="manual">Manual</button>
          </div>
          <p class="form-hint">Fixed applies default hours on present days</p>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">Shifts</h2>
        <div id="shifts-list"></div>
        <button type="button" class="btn btn-secondary" id="add-shift-btn" style="width:100%;margin-top:8px">Add shift</button>
      </div>

      <div class="card">
        <h2 class="card-title">Appearance</h2>
        <div class="segmented" id="theme-segmented">
          <button type="button" data-value="light">Light</button>
          <button type="button" data-value="dark">Dark</button>
          <button type="button" data-value="system">System</button>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">About</h2>
        <p class="form-hint" style="margin:0 0 6px">Version <span id="app-version">1.0.0</span></p>
        <p class="form-hint" style="margin:0">Data: <span id="data-source">Local storage</span></p>
      </div>
    </main>
  </div>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/attendance.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/components.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
