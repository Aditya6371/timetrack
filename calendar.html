<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <title>TimeTrack — Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
</head>
<body>
  <div class="app-shell" id="app-shell">
    <main class="main-content fade-in">
      <header class="app-topbar">
        <a href="index.html" class="brand">
          <span class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
          <span class="brand-text">TimeTrack</span>
        </a>
        <div class="sync-badge local sync-badge--mobile" aria-live="polite">
          <span class="sync-dot"></span><span>Local</span>
        </div>
      </header>
      <div class="page-header">
        <h1 class="page-title">Calendar</h1>
        <p class="page-subtitle">Select a date to view or edit attendance</p>
      </div>
      <div id="calendar"></div>
      <div class="legend">
        <span class="legend-item"><span class="legend-swatch cal-legend-present"></span> Present</span>
        <span class="legend-item"><span class="legend-swatch cal-legend-wfh"></span> Work from home</span>
        <span class="legend-item"><span class="legend-swatch cal-legend-absent"></span> Absent</span>
        <span class="legend-item"><span class="legend-swatch cal-legend-half"></span> Half day</span>
        <span class="legend-item"><span class="legend-swatch cal-legend-leave"></span> Leave</span>
        <span class="legend-item"><span class="legend-swatch cal-legend-checkedin"></span> Checked in</span>
        <span class="legend-item"><span class="legend-swatch cal-legend-weekend"></span> Weekend</span>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/attendance.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/components.js"></script>
  <script src="js/calendar.js"></script>
</body>
</html>
